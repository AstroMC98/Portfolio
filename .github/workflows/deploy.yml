name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Daily rebuild so future-dated blog posts go live on their publish date.
  schedule:
    - cron: '0 22 * * *' # 06:00 Asia/Manila

# Least privilege by default; only the deploy job gets Pages + OIDC scopes.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Every action is pinned to a commit SHA (a tag can be moved; a SHA cannot).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: withastro/action@a4407e937037e68022f04ae1c068d3634f08bc8d # v4.2.1
        with:
          node-version: 24

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
